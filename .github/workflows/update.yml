# Scheduled dependency update: bumps every pin (nix/update.sh), runs the full check on the bumped
# commit, and fast-forwards master on success. The bump is pushed to `auto/update` first; pushes
# made with GITHUB_TOKEN do not trigger other workflows, so this one runs the check itself.
# The app's packages (packages/app) follow its Expo SDK and are moved by hand.
name: update

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: cachix/install-nix-action@v31
      - name: Bump pins
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nix shell nixpkgs#nodejs nixpkgs#jq --command nix/update.sh >changes.txt
          if git diff --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Everything is up to date."
            exit 0
          fi
          cat changes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update bundle pins" -m "$(cat changes.txt)"
          git push --force origin HEAD:refs/heads/auto/update
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  check:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: nix flake check
        run: nix flake check -L --keep-going 2>&1 | tee flake-check.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-check-log
          path: flake-check.log

  merge:
    needs: [bump, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward master
        run: |
          set -euo pipefail
          # Fails (and leaves master alone) if master moved since the bump.
          git push origin "${{ needs.bump.outputs.sha }}:refs/heads/master"
          git push origin --delete auto/update
