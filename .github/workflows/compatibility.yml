# The bundle on every system harness supports: it builds, and its `harness` starts and answers.
# x86_64-linux's full check is check.yml; this one adds aarch64-linux and macOS (Apple silicon).
# Started on a schedule and by hand (`gh workflow run compatibility.yml`).
name: compatibility

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Build the bundle
        run: nix build -L .#packages.${{ matrix.system }}.default 2>&1 | tee build.log
      - name: harness starts
        run: |
          set -euo pipefail
          ./result/bin/harness --version
          ./result/bin/harness --help
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.system }}
          path: build.log
