# Reusable: builds the bundle on every supported platform, runs the smoke
# tests, and exports the store paths missing from cache.nixos.org as a signed
# binary-cache artifact per platform (published by publish-cache.yml).
name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Build
        run: nix build --print-build-logs .#default
      - name: Smoke tests
        # coreutils: `timeout` (missing on macOS runners).
        run: nix shell nixpkgs#jq nixpkgs#coreutils --command nix/smoke.sh result
      - name: Export binary cache
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: nix/cache-export.sh result "cache-${{ matrix.system }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cache-${{ matrix.system }}
          path: cache-${{ matrix.system }}
          retention-days: 3
