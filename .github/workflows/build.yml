# Reusable: one platform on the publication path; the full matrix is opt-in.
name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to build
        type: string
        required: true
      full-matrix:
        type: boolean
        default: false
      publish-cache:
        type: boolean
        default: false
      force:
        description: Rebuild even when this revision is already cached
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full-matrix && '[{"system":"x86_64-linux","runner":"ubuntu-latest"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","runner":"macos-latest"}]' || '[{"system":"x86_64-linux","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_SYSTEM: ${{ matrix.system }}
      CI_SHA: ${{ inputs.ref }}
      CI_PUBLISH: ${{ inputs.publish-cache }}
      CI_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check completed work
        id: plan
        run: python3 nix/ci.py plan >>"$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.action == 'build'
        with:
          extra_nix_config: |
            extra-substituters = https://github.com/thearchitect/harness/releases/download/nix-cache
            extra-trusted-public-keys = harness-1:YE1emDZFHptBwqvSGZIoVkGgCUwvCrBxoMFA+zps0Dg=
      - name: CI regression tests
        if: steps.plan.outputs.action == 'build'
        run: PYTHONDONTWRITEBYTECODE=1 python3 nix/test_ci.py
      - name: Flake check
        if: steps.plan.outputs.action == 'build'
        run: nix flake check --no-build --print-build-logs
      - name: Prefetch release assets
        if: steps.plan.outputs.action == 'build'
        # Anonymous GitHub release downloads from runners intermittently get
        # HTTP 403. An authenticated download added as a fixed-output path is
        # exactly what fetchurl would produce, so the build does not download it.
        # shell: bash adds pipefail, so a failing jq fails the step too.
        shell: bash
        run: |
          jq -r --arg system "$CI_SYSTEM" '.[].assets[$system].url // empty' nix/sources.json |
          while read -r url; do
            case "$url" in
              https://github.com/*/releases/download/*)
                IFS=/ read -r _ _ _ owner repo _ _ tag file <<<"$url"
                gh release download "$tag" --repo "$owner/$repo" --pattern "$file" --dir "$RUNNER_TEMP/prefetch" --clobber
                nix-store --add-fixed sha256 "$RUNNER_TEMP/prefetch/$file"
                ;;
              *)
                echo "not a GitHub release asset, left to fetchurl: $url"
                ;;
            esac
          done
      - name: Build
        if: steps.plan.outputs.action == 'build'
        run: nix build --print-build-logs .#default
      - name: Smoke tests
        if: steps.plan.outputs.action == 'build'
        run: nix develop --command nix/smoke.sh result
      - name: Smoke tests, every bundled tool on PATH
        if: steps.plan.outputs.action == 'build'
        run: |
          nix build --print-build-logs --out-link result-full ".#checks.$CI_SYSTEM.bundle-full"
          nix develop --command nix/smoke.sh result-full
      - name: Extension tests
        if: steps.plan.outputs.action == 'build'
        run: nix develop --command nix/test.sh result
      - name: Telegram gateway
        if: steps.plan.outputs.action == 'build' && runner.os == 'Linux'
        run: nix build --print-build-logs --no-link .#harness-telegram
      - name: Remote image
        if: steps.plan.outputs.action == 'build' && matrix.system == 'x86_64-linux'
        run: nix build --print-build-logs --no-link .#checks.x86_64-linux.remote-image .#checks.x86_64-linux.remote-tools .#checks.x86_64-linux.remote-image-size
      - name: Export binary cache
        if: inputs.publish-cache && steps.plan.outputs.action == 'build'
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          nix/cache-export.sh result "cache-$CI_SYSTEM"
          python3 nix/ci.py metadata "cache-$CI_SYSTEM"
      - name: Reuse checked cache artifact
        if: steps.plan.outputs.action == 'reuse'
        uses: actions/download-artifact@v8
        with:
          name: cache-${{ matrix.system }}-${{ inputs.ref }}
          run-id: ${{ steps.plan.outputs.source_run }}
          github-token: ${{ github.token }}
          path: cache-${{ matrix.system }}
      - uses: actions/upload-artifact@v7
        if: inputs.publish-cache && steps.plan.outputs.action != 'skip'
        with:
          name: cache-${{ matrix.system }}-${{ inputs.ref }}
          path: cache-${{ matrix.system }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Record checked artifact
        if: inputs.publish-cache && steps.plan.outputs.action != 'skip'
        run: python3 nix/ci.py ready
