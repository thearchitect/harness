name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this revision is already cached
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      # Cache publication is off: the release hit GitHub's 1000-asset limit
      # (publish-cache.yml is kept, no workflow calls it).
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets: inherit
