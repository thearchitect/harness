name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this revision is already cached
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      publish-cache: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    secrets: inherit

  publish-cache:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    uses: ./.github/workflows/publish-cache.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: write
      actions: read
      statuses: write
