# The check of every push to master and every pull request: `nix flake check` on
# Linux — the bundle builds, the type check, unit, integration and smoke tests
# pass (nix/check.nix). Heavy pipelines (native app targets, the full system
# matrix, updates, releases) are started by hand with `gh workflow run`.
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    # a cold run builds the bundle, the app and two NixOS VM tests
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: nix flake check
        run: nix flake check -L --keep-going 2>&1 | tee flake-check.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-check-log
          path: flake-check.log
