name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  publish-cache:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    uses: ./.github/workflows/publish-cache.yml
    permissions:
      contents: write
