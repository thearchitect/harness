# Reusable: append missing immutable cache assets; never prune other revisions
# or platforms. The shared release has a single writer across all workflows.
name: publish-cache

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA whose checked artifacts may be published
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nix-cache-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_SHA: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check for cache artifacts
        id: artifacts
        run: python3 nix/ci.py artifacts >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.artifacts.outputs.available == 'true'
        with:
          pattern: cache-*-${{ inputs.ref }}
          merge-multiple: false
          path: cache
      - name: Publish missing assets
        if: steps.artifacts.outputs.available == 'true'
        run: python3 nix/ci.py publish cache
