name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://github.com/thearchitect/harness/releases/download/nix-cache
            extra-trusted-public-keys = harness-1:YE1emDZFHptBwqvSGZIoVkGgCUwvCrBxoMFA+zps0Dg=
      - name: Deploy
        env:
          # The private key of the actions-ci recipient (ops:ci-cage-identity).
          CAGE_SSH_IDENTITY: ${{ secrets.CAGE_SSH_IDENTITY }}
        run: nix develop --command cage run @ci-deploy - ./deploy.sh
