# One machine with a volume, always on: the user's hub keeps its agents and background tasks
# running, and devices connect to it at any time.
app = "my-harness"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 30

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "20gb"

# The machine's cage identity (bootstrap.sh), written as a file at boot: it decrypts the users'
# env (.cage/store/envs/user-<name>.cage) for the hub.
[[files]]
  guest_path = "/run/harness/machine-identity"
  secret_name = "HARNESS_MACHINE_IDENTITY"

# The hub's network endpoint; Fly terminates TLS (wss://<app>.fly.dev).
[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[restart]]
  policy = "always"

# Builds (go, rust) and the agents (≈300 MB each).
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
