# The deployment: whose hub it is and their initial settings. lib.mkRemoteImage builds the
# user's hub from it; changes take effect with the next deploy.
#
# The user's home is on the volume (/data/home/<name>) and the hub runs as their uid. Devices
# are paired on the machine:
#   fly ssh console -C "s6-setuidgid alice env HOME=/data/home/alice harness hub device add --name laptop"
# and on the device: open the link it prints, scan its QR code, or harness connect <link>.
user:
  name: alice
  uid: 1001

# ~/.harness/agent/settings.json of the user, pi's (an existing file is never touched).
defaultSettings:
  defaultProvider: deepseek
  defaultModel: deepseek-v4-pro
  defaultThinkingLevel: high
