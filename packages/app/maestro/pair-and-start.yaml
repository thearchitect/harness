# The app on a device: pairs with a hub by its address and a one-time code, starts a session on
# the hub's node and sees the editor. HUB and CODE come from the run (native-android.yml).
appId: dev.harness.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Pairing code"
    timeout: 60000
- tapOn: "Hub address"
# typing before the keyboard is up loses all but the first character (iOS)
- waitForAnimationToEnd
- inputText: ${HUB}
- tapOn: "Pairing code"
- inputText: ${CODE}
# the code field's return key pairs
- pressKey: Enter
- extendedWaitUntil:
    visible: "New session"
    timeout: 60000
- takeScreenshot: paired
- tapOn: "New session"
- extendedWaitUntil:
    visible: "~"
    timeout: 30000
# the keyboard rising moves the block: tap once it stands
- waitForAnimationToEnd
- tapOn: "~"
- extendedWaitUntil:
    # iOS names a multiline field by its text: the editor is found by its test id
    visible:
      id: "message"
    timeout: 60000
- takeScreenshot: session
# the hidden strips open over the screen (a narrow screen): the session is there
- tapOn: "Sessions"
- extendedWaitUntil:
    visible: "New session"
    timeout: 10000
- takeScreenshot: sessions-strip
# a harness:// link names a session: one that does not exist is reported
- openLink: "harness://hub/no-such-session"
# iOS asks whether the link may open the app
- runFlow:
    when:
      visible: "Open in .harness.\\?"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "no session no-such-session on hub"
    timeout: 20000
