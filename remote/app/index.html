<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>harness</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <link rel="stylesheet" href="{{app.css}}">
  <script defer src="{{app.js}}"></script>
  <script defer src="{{alpine.js}}"></script>
</head>
<body x-data="app" :class="{ stale: stale }">
  <template x-if="problem">
    <p class="problem" x-text="problem"></p>
  </template>

  <template x-if="state && screen === 'main'">
    <main>
      <header class="bar">
        <h2 class="grow" x-text="state.workspace.title"></h2>
        <nav>
          <a href="#" @click.prevent="open('files')">Files</a>
          <a href="#" @click.prevent="open('models')">Models</a>
        </nav>
      </header>

      <section id="here">
        <template x-if="here">
          <div class="card">
            <div class="title" x-text="here.dir + ' · ' + here.title"></div>
            <div class="hint" x-text="statusText(here)"></div>
            <div class="fields">
              <label>Model
                <select :disabled="stale || busy" @focus="loadModels(here.id)" @change="act({ type: 'model', agentId: here.id, provider: $event.target.value.split('/')[0], id: $event.target.value.split('/').slice(1).join('/') })">
                  <option x-text="here.model ?? 'not started'" :value="here.model ?? ''" selected></option>
                  <template x-for="m in (models[here.id] ?? []).filter((m) => m !== here.model)" :key="m">
                    <option :value="m" x-text="m"></option>
                  </template>
                </select>
              </label>
              <label>Thinking
                <select :disabled="stale || busy" @focus="loadLevels(here.id)" @change="act({ type: 'thinking', agentId: here.id, level: $event.target.value })">
                  <option x-text="here.thinking ?? '—'" :value="here.thinking ?? ''" selected></option>
                  <template x-for="l in (levels[here.id] ?? []).filter((l) => l !== here.thinking)" :key="l">
                    <option :value="l" x-text="l"></option>
                  </template>
                </select>
              </label>
            </div>
            <div class="actions">
              <button x-show="here.status === 'running' || here.status === 'waiting'" :disabled="stale || busy" @click="act({ type: 'stop', agentId: here.id })">Stop</button>
              <button :disabled="stale || busy" @click="act({ type: 'detach' })">Detach</button>
              <button class="destructive" :disabled="stale || busy" @click="confirmThen('Close the agent? Its session stays in the history.', { type: 'close', agentId: here.id })">Close</button>
            </div>
          </div>
        </template>
        <template x-if="!here">
          <div class="card row">
            <span class="grow hint">No agent here.</span>
            <button @click="open('files')">New agent…</button>
          </div>
        </template>
      </section>

      <section id="agents" x-show="others.length > 0">
        <h3>Agents</h3>
        <template x-for="a in others" :key="a.id">
          <div class="card">
            <div class="title" x-text="a.dir + ' · ' + a.title"></div>
            <div class="hint" x-text="statusText(a) + ' · ' + (a.workspace ? a.workspace.title : 'background')"></div>
            <div class="actions">
              <button :disabled="stale || busy" @click="act({ type: 'attach', agentId: a.id })">Here</button>
              <select class="move" :disabled="stale || busy" @change="$event.target.value && act({ type: 'move', agentId: a.id, to: Number($event.target.value) }); $event.target.value = ''">
                <option value="">Move to…</option>
                <template x-for="w in state.workspaces.filter((w) => w.id !== state.workspace.id && w.agentId !== a.id)" :key="w.id">
                  <option :value="w.id" x-text="w.title"></option>
                </template>
              </select>
              <button class="destructive" :disabled="stale || busy" @click="confirmThen('Close the agent? Its session stays in the history.', { type: 'close', agentId: a.id })">Close</button>
            </div>
          </div>
        </template>
      </section>

      <section id="workspaces">
        <h3>Workspaces</h3>
        <template x-for="w in state.workspaces" :key="w.id">
          <div class="row line">
            <span class="grow" x-text="w.title"></span>
            <span class="hint" x-text="agentDir(w.agentId)"></span>
          </div>
        </template>
      </section>

      <section id="sessions">
        <h3>History</h3>
        <input type="search" placeholder="Filter by directory or title" x-model="filter">
        <template x-if="sessions === undefined">
          <p class="hint">Loading…</p>
        </template>
        <template x-for="s in shownSessions" :key="s.id">
          <button class="session" :disabled="stale || busy" @click="act({ type: 'resume', sessionId: s.id })">
            <span class="title" x-text="s.title || 'untitled'"></span>
            <span class="hint" x-text="s.dir + ' · ' + ago(s.modified)"></span>
          </button>
        </template>
      </section>
    </main>
  </template>

  <template x-if="state && screen === 'files'">
    <main>
      <header class="bar">
        <a href="#" @click.prevent="back()">‹ Back</a>
        <h2 class="grow">Files</h2>
        <label class="toggle"><input type="checkbox" x-model="showHidden"> hidden</label>
      </header>
      <div class="card">
        <nav class="crumbs">
          <template x-for="(c, i) in crumbs" :key="c.path">
            <span><a href="#" @click.prevent="browse(c.path)" x-text="c.name"></a><span x-show="i < crumbs.length - 1"> / </span></span>
          </template>
        </nav>
        <button class="wide" :disabled="stale || busy" @click="act({ type: 'new', dir: dir.path }).then((ok) => ok && back())">Start agent here</button>
      </div>
      <div class="card list">
        <template x-if="dir.loading">
          <p class="hint">Loading…</p>
        </template>
        <template x-if="parent !== undefined">
          <div class="row line">
            <a href="#" class="grow" @click.prevent="browse(parent)">..</a>
          </div>
        </template>
        <template x-if="!dir.loading && shownEntries.length === 0">
          <p class="hint">Empty.</p>
        </template>
        <template x-for="e in shownEntries" :key="e.name">
          <div class="row line">
            <template x-if="e.kind === 'dir'">
              <a href="#" class="grow" @click.prevent="browse(dir.path + '/' + e.name)" x-text="e.name + '/'"></a>
            </template>
            <template x-if="e.kind !== 'dir'">
              <span class="grow" x-text="e.name"></span>
            </template>
            <span class="hint" x-show="e.kind === 'file'" x-text="size(e.size)"></span>
            <a href="#" class="icon" title="Download" @click.prevent="download(dir.path + '/' + e.name)">↓</a>
          </div>
        </template>
        <p class="hint" x-show="dir.truncated">Only the first 500 entries are shown.</p>
      </div>
      <div class="card row">
        <input class="grow" type="text" placeholder="New folder" x-model="folderName" @keydown.enter="newFolder()">
        <button :disabled="busy || folderName.trim() === ''" @click="newFolder()">Create</button>
      </div>
    </main>
  </template>

  <template x-if="state && screen === 'models'">
    <main>
      <header class="bar">
        <a href="#" @click.prevent="back()">‹ Back</a>
        <h2 class="grow">Models</h2>
      </header>
      <template x-if="settings === undefined">
        <p class="hint">Loading…</p>
      </template>
      <template x-if="settings">
        <div>
          <p class="hint">Favorites are what agents switch between; each keeps its thinking level. New agents start on the default.</p>
          <template x-for="f in settings.favorites" :key="f.provider + '/' + f.id">
            <div class="card">
              <div class="row">
                <span class="grow title" x-text="f.provider + '/' + f.id"></span>
                <label class="toggle"><input type="radio" name="default" :checked="isDefault(f)" @change="setDefault(f)"> default</label>
              </div>
              <div class="row">
                <label class="grow">Thinking
                  <select @change="f.effort = $event.target.value || undefined; saveSettings()">
                    <option value="" :selected="f.effort === undefined">pi's default</option>
                    <template x-for="l in levelsOf(f)" :key="l">
                      <option :value="l" x-text="l" :selected="f.effort === l"></option>
                    </template>
                  </select>
                </label>
                <button class="destructive" @click="removeFavorite(f)">Remove</button>
              </div>
            </div>
          </template>
          <template x-if="settings.patterns.length > 0">
            <p class="hint" x-text="'Also enabled by pattern: ' + settings.patterns.join(', ')"></p>
          </template>
          <div class="card row">
            <select class="grow" x-model="adding">
              <option value="">Add a model…</option>
              <template x-for="m in settings.available.filter((m) => !settings.favorites.some((f) => f.provider === m.provider && f.id === m.id))" :key="m.provider + '/' + m.id">
                <option :value="m.provider + '/' + m.id" x-text="m.provider + '/' + m.id"></option>
              </template>
            </select>
            <button :disabled="!adding || busy" @click="addFavorite()">Add</button>
          </div>
        </div>
      </template>
    </main>
  </template>
</body>
</html>
