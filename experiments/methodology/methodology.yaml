# r1
methodology:
  - title: General principles
    items:
      - title: The Good Sense Rule
        note: Your main tool in the field.
        items:
          - title: Any principle could be dropped/avoided/changed **situationally** according to the rule
          - title: Prefer good sense over formal process
      - title: Try to maintain subconscious-understandability of your code and architecture
        note: |-
          Software engineering is about engineers, not machines.
          Always remember it designing your software.
          The architecture you develop should be subconsciously-understandable by a human on all levels.
          Most of the guide is about it.
      - title: Simplicity and Minimalism
        note: |-
          TODO: +SRP; Simple and minimal architecture/code/codebase structure is a key to understandability and stability.
          So if you can achieve same result with fewer code/modules - do it.
        items:
          - title: No overgeneralization
            note: TODO
          - title: No pattern juggling
            note: TODO
          - title: Less code
          - title: Smaller and shallower CFG
          - title: Smaller and shallower DFG
          - title: Smaller dependency graph
          - title: Smaller scopes
          - title: Shorter lifetimes
          - title: Smaller and shallower project tree
          - title: Fewer entity classes/types
          - title: Fewer entities
          - title: Fewer modules
          - title: Fewer layers
          - title: Fewer services
          - title: Fewer dependencies
      - title: SRP (Single Responsibility Principle)
        items:
          - title: Works in both directions
            items:
              - title: One module is responsible for one and only one function
              - title: One function is implemented by only one module
          - title: Applies to all levels
            note: From small internal modules to services
      - title: Maximum decomposition level possible
        note: If you can draw a dividing line, without sacrificing **simplicity** and **SRP** - draw it.
      - title: Maximum explicitness and straightforwardness
        note: |-
          Your solutions should be implemented the most straightforward way
          (i.e. no Dependency Injection containers/frameworks;
          explicit constructor-passed dependencies are the way to achieve explicitness)
      - title: Strongest contract possible
        note: Every statement you make should be described in a form of executable and non-executable code
        items:
          - title: Non-executable contract
            note: i.e. code-first DAO, readable method signatures, class/interface/structure definitions, protobuf definitions, etc.
          - title: Executable contract
            note: TODO
      - title: Dependency hygiene
        note: |-
          it's better to write few (even hundreds) lines of code to solve the problem
          than introduce a 3rd party solution, that you will need to learn and depend on, struggling with its limitations.
          Introduce only high quality dependencies
      - title: No impractical decisions
        note: If you decision leads to no direct practical positive effect - avoid it
      - title: No blind best-practice following
        note: Best-practice applied "just in case" or "just because" is a worst-practice. (i.e. 'Repository' pattern)
      - title: "TODO: Technical Debt"
      - title: "TODO: Observability"
      - title: "TODO: Consistency"
        note: Must always present at 100% level (be it immediate or eventual)
      - title: Beware of the **False Simplicity**
        note: Some techniques offers false simplicity. Be smart and avoid them.
        items:
          - title: Untyped languages
            note: "*they are not simpler, they are less specific, thus more complex*"
          - title: Schema less approaches of any kind
            note: "also simply less specific, you always have schema, the question is: is it recorded/enforced or not?"
          - title: CRUD methods
            note: loss of specificity
          - title: '"Do fast then refactor" approach'
            note: know how? do now!
          - title: Dependency Injection containers/frameworks
            note: |-
              simply makes data flow less obvious, thus more complex.
              Explicit dependencies passed through constructors are not DI in this sense - they are explicitness.
          - title: GraphQL
            note: gives you too much freedom; less freedom - more control; harder to optimize
      - title: Systems developed according to these principles
        items:
          - title: Has better stability
          - title: Has better maintainability
          - title: Requires fewer engineering resources
          - title: Give engineers ability of faster onboarding
          - title: Requires low test coverage to be stable
          - title: Requires no debugger (and a debugging process at all) to find a problem
            note: |-
              A mark of a high quality system:
              You can determine a problem by looking only at a stacktrace and error description
              to know exact error and reason
          - title: Easier to understand
      - title: Some general notes
        items:
          - title: Technologies should not be just comfortable to use for your team - they should be comfortable to use for your **well-trained** team
          - title: Everyone should write code in a similar style to others
            items:
              - title: Makes work efficient
              - title: Speeds up onboarding
              - title: Speeds up switching
          - title: If something could be automated - it should be automated
          - title: If something could be simplified - it should be simplified
            items:
              - title: Support costs depend on quality and simplicity
          - title: Dirty hacks during prototyping ("do fast then refactor" myth) emerge because of laziness and lack of knowledge. Do it right from the beginning! (if it's not a presentation mockup)
          - title: The proposition that building a general-purpose system is a more complex task is a myth; on a distant prospect, general-purpose systems are easier to extend and maintain
  - title: General Architecture
    items:
      - title: Steps
        note: TODO
        items:
          - title: Design
            items:
              - title: Understand the domain
              - title: Gather requirements
              - title: Imagine your system after 5 years in production
              - title: Initial architecture papers
          - title: Model
            items:
              - title: DTO / API
              - title: DAO
              - title: Code Infrastructure
              - title: Benchmarks for predicted corner cases?
          - title: Development
            items:
              - title: Tests
              - title: Implementation
      - title: Entities must represent real-world objects
      - title: Architecture developed using deductive approach (top-down)
        items:
          - title: No "special cases"
            note: changes we bring should be a part of a common well-designed concept
            items:
              - title: "Bad design formula: [work] = [new requirements]"
              - title: "Good design formula: [work] = [brand new system design with new requirements] - [current system]"
          - title: No fragmentary changes
            note: (new requirements never implemented as-is)
            items:
              - title: They are going through the architecture development process
              - title: Fragmentary changes clutters architecture and it becomes a bunch-of-special-cases
      - title: Rules of decomposition
        note: TODO
        items:
          - title: Will separation of this domain/subdomain bring problems/complexities?
          - title: Different workload type
          - title: Different load pattern
            note: (simply. CPU, RAM, DISK, etc usage)
          - title: Different security requirements
          - title: Homogeneous domains should not be split
            note: todo
          - title: Could be decomposed without significant complexity rise
          - title: No premature optimization
            items:
              - title: Optimization could break decomposition, encapsulation and influence architecture
              - title: So optimizations should be done on the ready-made system
          - title: All modules should be homogeneous
            items:
              - title: If a module implements domain logic on top of a specific database, nothing else here
              - title: Doing specific data computation? Nothing else here.
              - title: Doing other kind of computation? Same.
              - title: Implements FSM that describes a process? Only FSM impl is here. In a separate module.
      - title: Control flow
        note: TODO
      - title: Data flow
        items:
          - title: Module should have no global state
            note: the only exception is tests, they may have DDL-like appearance
          - title: Scopes should have as few symbols as possible (especially at package scope, especially public ones)
            note: "TODO: explanation"
          - title: Declarations should have the narrowest possible scope it could have
            note: "TODO: explanation"
      - title: Polymorphism
        note: TODO
        items:
          - title: Interface is a polymorphism tool, not an encapsulation tool
          - title: Interfaces != Polymorphism
          - title: Never use polymorphism for encapsulation
          - title: No redundant polymorphism
            items:
              - title: Should be incorporated only when **really** necessary
                note: |-
                  Never build polymorphic constructs "just in case".
                  Redundant polymorphism bloats application architecture and makes it less readable
              - title: Adds extra layers
              - title: Rises complexity
          - title: Method overloading makes code less readable/understandable
          - title: Inheritance
            items:
              - title: Better avoid it
      - title: Encapsulation
        note: TODO
        items:
          - title: Polymorphism != Encapsulation != Interfaces
            note: Use decomposition and visibility setting for encapsulation
          - title: This is simple
          - title: Being properly decomposed, a module hides its complexity behind its API
          - title: If something should not be done, there should be no way to do it
      - title: Data modeling
        items:
          - title: Your DAO must reflect real world
            items:
              - title: Entities should be named accordingly to its predestination and their names should be **subconsciously understandable**
          - title: You should achieve your goals using properly designed DAO, not by using rich query language
            items:
              - title: Good DAO ⇒ simpler queries ⇒ faster system
              - title: Shift your focus from building awesome queries to building awesome data model ;)
          - title: Model should be defined in a 'clean' way
            note: |-
              means in a separate package with no I/O and no process logic on the model;
              i.e.: classical DAO approach is contrary to this case.
              Pure computations over own fields (derived values, state predicates) are allowed - they are the model, not a DAO.
          - title: Data model should not cross boundaries of it's (sub)domain
            note: "i.e.: DAO should not be used as a DTO"
          - title: Data model should have exactly one owner
            note: If you need to access someones data - use API; This is what API is built for.
          - title: "**Tree data model** is preferred over **Tabular data model** for business domain"
            note: If you're disagree, please send CSV in responses from now on
          - title: "TODO: Denormalization (+levels)"
          - title: Reference entities only by ID
          - title: Each (sub)domain should maintain its own data model, and own it
            items:
              - title: No other service can access this data directly
          - title: "Similar entities should be merged into a single entity if: (TODO)"
            items:
              - title: Most of the data are similar
              - title: Non-similar data could be described using some pattern without sacrificing semantics/readability
              - title: "Handling principle is similar (i.e.: most of methods are identical)"
              - title: Structures are similar
              - title: Structures could be merged without sacrificing semantics/readability
          - title: Data converters
            items:
              - title: Maintain data converters in a separate package
              - title: Keep it purely functional
              - title: Make it not return errors (if possible)
      - title: API
        items:
          - title: Should be designed first!
          - title: API is the main thing; being properly designed it will be future-proof. Then you can make changes to internal architecture without breaking compatibility.
          - title: API is **data** layer! (not **presentation**)
            note: Presentation logic should influence it as less as possible (unless you design presentation management API)
          - title: "TODO: deprecation"
          - title: No CRUD
            note: CRUD == loss of specificity and false simplicity; period;
            items:
              - title: For what?
              - title: No control over which data is actually changed
              - title: No audit log events /or complex and unreliable diff heuristics
              - title: Some data modifications require custom logic
              - title: Data races /or complex concurrency control (forced MVCC)
              - title: Change state ⇒ update ⇒ What we've changed here, uh???
              - title: "Example: updating user name"
                note: |-
                  1. client knows that it wants to update user's name
                  2. but decides to lose context and sends UpdateUser
                  3. server accepts request and analyzes, which data is being changed. Oh sh! He wants to update user name!
                  4. server now has to guess preconditions, audit event and concurrency rules for a change it did not name
                  5. with RenameUser the intent, the preconditions, the event and the race check are all one explicit action
              - title: Client already knows what it wants to do.
      - title: Defining how things work. And only then pick technologies.
      - title: Good architecture is superior to raw performance where applicable
      - title: Complexity management
        items:
          - title: Complexity management - one of the main purposes of decomposition
          - title: Should be isolated / localized
          - title: Divide your system in two parts
            items:
              - title: The simple one
                note: Familiar structure/patterns
              - title: The complex one
                note: Well document complex parts
      - title: "TODO: Speculative vs Envisional"
        note: |-
          Speculative engineering vs Previsionary (todo)
          Example: with LoadBalancer and BalancingStrategy
      - title: Architecture development process has nothing in common with technology selection
      - title: Good architecture is future-proof
        note: |-
          which means most of the improvements have incremental nature
          (you only write new code with minimal refactoring)
      - title: When designing something you should extend requirements to fit all future requirements but limit your imagination to real cases
        items:
          - title: This means your job is to find the broadest solution with minimum complexity
      - title: 2 modes
        items:
          - title: Good design ⇒ Implementation
          - title: Quick prototype ⇒ Validation/testing ⇒ Good design ⇒ Implementation
      - title: Choosing technologies
        items:
          - title: TODO
          - title: Prefer language/platform-native solutions if possible
      - title: DAL
        items:
          - title: "Implements only one thing: data access from a specific database"
          - title: DAL is data logic freed from side effects, not a thin repository
            note: |-
              Multi-step data processes (conditional transitions, transactions, dedup, fact markers)
              belong to DAL. Upper layers own side effects (providers, banks, channels) and call DAL actions.
          - title: Could be split to modules
          - title: Modules never import each other
            note: |-
              Sharing the storage model package is not importing a DAL module;
              a subsystem may read another domain's collections with its own DAL through the shared model.
          - title: A specific DAL module accesses only one database
          - title: No polymorphic DALs if not strictly necessary
      - title: Data
        items:
          - title: More data
            items:
              - title: All data collected should be ingressed
              - title: All the data ingressed should be saved
              - title: All the primary data should be saved unaltered
          - title: "**Tree data model** is strongly preferred over **Tabular data model** for business domain"
            items:
              - title: Why do we use XML/JSON/YAML in business domain and not CSV?
              - title: Human consciousness works with vertices and edges
          - title: No duplicated data - except for denormalization
            note: It's fine to denormalize **read-only** data (SAFE), but be careful when making a decision to denormalize **mutable** data (DANGEROUS)
  - title: Reactive Systems Design (todo)
    items:
      - title: All data is versioned
      - title: The only way to obtain the data is via **subscription**
      - title: Mutation returns the full modified entity; with all modified dependencies
      - title: Dependencies are not embedded in each other, but returned separately
      - title: On the client side, deps are not embedded, but resolved using store/getters
      - title: Backend decides which data and when it provides to the client
        items:
          - title: Backend manages data dependencies
  - title: Application architecture
    items:
      - title: General rules
      - title: Executable module design
        items:
          - title: Routing should be FLAT and declared in entrypoint to be easily reachable and readable
          - title: "TODO: error handling / middleware"
          - title: Entry point should should reside in a separate library package
            note: to be callable from anywhere (i.e. tests)
          - title: Entry point should be as small as possible. It’s only a glue for subordinate entities.
          - title: All service-wide entities should be instantiated in the entry point and passed through the call stack
            note: "i.e.: logger, data access layer instance, etc"
          - title: Proper lifecycle management
            items:
              - title: At the very beginning of the entry point we should have a global Context object instantiated
                note: |-
                  Later this object should be passed through the call stack accompanying the control flow.
                  This object should be nested and passed to every HTTP/gRPC/etc handler call using specific middlewares or http.Server.BaseContext callback in case of HTTP server.
              - title: Every service’s entry point should handle SIGINT|SIGTERM|SIGKILL
                note: When the signal is caught, it should cancel the global context to initiate graceful shutdown
              - title: Graceful shutdown
                items:
                  - title: The graceful shutdown should be implemented by every internal process.
                  - title: During the graceful shutdown entry point should wait for them to finish (with timeout).
                  - title: Graceful shutdown process should have a reasonable timeout, to not last forever.
                  - title: System/data integrity should never rely on graceful shutdown
                    note: hence atomic writes or resumable-by-marker workers for every multi-step operation
          - title: Handlers
            items:
              - title: Handlers should be thin.
                note: Most of the logic should be encapsulated into a subordinate entities.
              - title: Handlers should be bound to a structs (except some special cases)
      - title: Library design
        items:
          - title: When to decompose function into a separate library?
            note: If it should be used in another service (even if service does not exists yet)
          - title: Every entity should have a constructor defined as a package level function
            items:
              - title: If there is the only entity in a package, then the constructor function should be named New
              - title: If there are multiple entities in a package, then constructor functions should be named New%EntityName%
      - title: Testing
        items:
          - title: Types
            items:
              - title: Reference
                note: Simple test used mainly to demonstrate common usage patterns of a tested system
              - title: Positive
              - title: Negative
              - title: Regression
          - title: Tests should be super-readable
          - title: Functional packages are tested using regular unit style
          - title: Stateful modules are tested in a BDD style
            note: "this services two purposes:"
            items:
              - title: It provides module's API usage scenario
              - title: It tests module's API in scenario-way, as it's designed
          - title: Redundant mocking is an evil
            items:
              - title: Why?
                note: It bloats code, overcomplicates architecture, mitigates testing efficiency, wastes time.
                items:
                  - title: You spend time to write mock
                  - title: Or you introduce a complex dependency
                  - title: But your mock's behaviour differs from the original dependency behaviour
                    note: |-
                      Thus mitigates testing efficiency.
                      (behaviour of your system running with original dependency could produce errors not covered by test made with mock)
                  - title: You have more code in a codebase
                  - title: You bloat application architecture and sacrifice simplicity
                    note: By introducing redundant layers and redundant polymorphism
                  - title: And then your spend more time to support/improve this mock
              - title: So it can be applied only if there is no other solutions.
                note: |-
                  If your unit requires to run alongside a DBMS in docker/compose to test it - run it.
                  Unit test with DBMS dependency is still a unit test.
              - title: If there is no other solutions, it should be applied
              - title: Storage mocks are never used
                note: |-
                  If a unit cannot be tested without a mock, it is tested as an integration test
                  against real dependencies (service-level tests/ or repo-level integration tests/).
          - title: Redundant tests are evil also
            note: |-
              This is not true for mission-critical systems,
              no test is redundant for them.
          - title: Developers do manual testing!
            items:
              - title: You developed a feature.
              - title: You are the author and know the edge cases.
              - title: Test it briefly in UI.
              - title: "You may find: errors, UX inconsistencies, unexpected behaviour, etc."
          - title: DDL - better
          - title: BDD - more descriptive
          - title: Tests as docs
  - title: Code style and conventions
    note: TODO
    items:
      - title: Coding Practices
        items:
          - title: Maximum function purity!
            items:
              - title: If a method is not pure enough, mutated args go first; method name must contain a `_Mutate` suffix
          - title: Top level symbols (functions, structs/classes) should have exceptionally readable names. [-]
            note: "*No 'common', 'dry', 'kiss', 'pkg', 'types', 'lib', 'meta', etc packages*"
      - title: Variables naming
        items:
          - title: Smaller scope => Shorter name
          - title: No premature variable declaration
            note: |-
              This widens and hardens understanding it's scope and lifetime
      - title: Error handling
        items:
          - title: If you need more than 10 minutes to find the exact error cause, then something is really bad with your code
          - title: All errors should be handled
          - title: All errors should be reported at the moment they emerge
          - title: System should be designed the way it CAN'T fail silently
          - title: Functions that ask the OS to terminate the process should not be used
            items:
              - title: "i.e.: Golang's `os.Exit()` and `log.Fatal()`."
              - title: These calls prevent the application from calling deinitialisation logic.
          - title: Errors should be typed
      - title: Logging / tracing (TODO)
        items:
          - title: Logging, tracing, error handling - one tightly coupled system
      - title: Structure
        note: TODO
        items:
          - title: Basic/conventional/regulated entities
            items:
              - title: "Almost every project contains limited amount of entity types:"
                items:
                  - title: entrypoint
                    note: top-level executable package
                  - title: entrypoint (as a package)
                    note: "package: 'app'"
                  - title: storage data model
                    note: "package: 'model'"
                  - title: data access layer
                    note: "package: 'dal'"
                  - title: model <-> DTO converters
                    note: "package: 'conv'"
                  - title: api implementations
                    note: "package: 'api'"
                  - title: workers
                    note: "package: 'workers'"
                  - title: request middleware (session, authorization helpers)
                    note: "package: 'middleware'"
                  - title: integrations
                    note: "package: 'integrations'"
                  - title: service-level domain-agnostic libraries
                    note: "package: 'lib'"
                  - title: subsystems
                    note: "package: 'subsystems'; each one repeats the conventional structure in miniature"
              - title: Each conventional entity group should be represented by it's own package at the top level of the repo
              - title: Each member of a group is a subpackage (directory per handler group / worker); small members may be files prefixed with the group name
                note: "i.e.: workers/session_ttl/ and dal/dal_user.go"
          - title: Non-conventional elements
            note: TODO
  - title: Technical Debt & Refactoring
    items:
      - title: Technical Debt
        items:
          - title: Elimination starts from global deductive architecture reassessment
            items:
              - title: Only when you have the new reference architecture you can start debt elimination
          - title: Remember - sometimes refactoring consumes more time than an 80% rewrite
      - title: Refactoring
        items:
          - title: Must be a continuous process
          - title: Must be never postponed
  - title: Investigation
    items:
      - title: Always start investigation from the place where the problem was detected
  - title: Docs
    items:
      - title: No redundant docs - only non-obvious things should be documented
      - title: Entrypoint document
        items:
          - title: Covers 80% of high-level system knowledge
          - title: Services
          - title: Link to DAO model
          - title: Link to DTO model
          - title: Hacks / known issues list
          - title: Deployment requirements (envVars, affinity, dependencies, general requirements, etc.)
          - title: Patterns and their implementations used project-wide (grouped by repository)
          - title: Key architecture concepts (streams, ...)
      - title: Code as docs first
      - title: Only unobvious things should be documented
  - title: Glossary
    items:
      - title: SRP
        note: Single Responsibility Principle
      - title: CFG
        note: Control Flow Graph
      - title: DFG
        note: Data Flow Graph
      - title: DAL
        note: Data Access Layer
      - title: DAO
        note: |-
          aka **Storage Model**
          Data Access Object, a model used to describe data stored in DBMS.
          It this guide's context, it's a simple definition, contrary classical DAO pattern implementation
      - title: DTO
        note: |-
          aka **Exchange Model**
          Data Transfer Object, a plain model used to describe objects that travels via network APIs.
      - title: BDD
        note: Behaviour Driven Development. In this guide this term is applied only to BDD-styled tests.
      - title: TDD
        note: Test Driven Development
      - title: DDL
        note: Domain Definition Language
      - title: CQRS
        note: TODO
      - title: DDD
        note: Dildo Driven Development
      - title: HaBaDD
        note: HAppypath BAsed Development Disease
      - title: DRY, KISS, SOLID, SOC, YAGNI, BDUF
        note: TODODO
